<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Top 50 — 2019</title>
<link href="https://fonts.googleapis.com/css2?family=Circular+Std:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1DB954;
    --green-light: #1ed760;
    --green-dark: #158a3e;
    --black: #121212;
    --dark: #181818;
    --dark2: #282828;
    --dark3: #333333;
    --gray: #535353;
    --gray2: #b3b3b3;
    --white: #FFFFFF;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── HEADER ─── */
  header {
    background: linear-gradient(180deg, #0a3d20 0%, #121212 100%);
    padding: 40px 48px 32px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(29,185,84,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 28px;
  }
  .spotify-logo {
    width: 44px; height: 44px;
    background: var(--green);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .spotify-logo svg { width: 26px; }
  .header-text h1 {
    font-family: var(--font-display);
    font-size: clamp(40px, 6vw, 80px);
    letter-spacing: 2px;
    line-height: 1;
    color: var(--white);
  }
  .header-text h1 span { color: var(--green); }
  .header-text p {
    color: var(--gray2);
    font-size: 14px;
    font-weight: 300;
    margin-top: 6px;
    letter-spacing: 0.5px;
  }
  .header-badge {
    margin-left: auto;
    background: var(--green);
    color: var(--black);
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 1px;
    padding: 10px 22px;
    border-radius: 4px;
    white-space: nowrap;
  }

  /* ─── MAIN LAYOUT ─── */
  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px 48px 60px;
  }

  /* ─── KPI CARDS ─── */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }
  .kpi-card {
    background: var(--dark);
    border-radius: 8px;
    padding: 24px 20px;
    border: 1px solid var(--dark3);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s;
  }
  .kpi-card:hover {
    transform: translateY(-3px);
    border-color: var(--green);
  }
  .kpi-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--green);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s;
  }
  .kpi-card:hover::after { transform: scaleX(1); }
  .kpi-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gray2);
    margin-bottom: 10px;
  }
  .kpi-value {
    font-family: var(--font-display);
    font-size: 42px;
    color: var(--white);
    letter-spacing: 1px;
    line-height: 1;
  }
  .kpi-value span { color: var(--green); font-size: 26px; }
  .kpi-sub {
    font-size: 12px;
    color: var(--gray);
    margin-top: 6px;
    font-family: var(--font-mono);
  }

  /* ─── SECTION TITLE ─── */
  .section-title {
    font-family: var(--font-display);
    font-size: 28px;
    letter-spacing: 1px;
    color: var(--white);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--dark3);
  }

  /* ─── CHARTS ROW ─── */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 32px;
  }
  .chart-card {
    background: var(--dark);
    border-radius: 8px;
    padding: 24px;
    border: 1px solid var(--dark3);
  }
  .chart-card h3 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--gray2);
    margin-bottom: 18px;
  }
  canvas { display: block; width: 100% !important; }

  /* ─── FILTERS ─── */
  .filters-bar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    align-items: center;
  }
  .filter-label {
    font-size: 12px;
    color: var(--gray2);
    font-weight: 500;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-right: 4px;
  }
  .filter-btn {
    background: var(--dark2);
    border: 1px solid var(--dark3);
    color: var(--gray2);
    padding: 7px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-family: var(--font-body);
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--green);
    color: var(--black);
    border-color: var(--green);
    font-weight: 700;
  }
  .search-box {
    margin-left: auto;
    background: var(--dark2);
    border: 1px solid var(--dark3);
    border-radius: 20px;
    padding: 7px 18px 7px 36px;
    color: var(--white);
    font-size: 13px;
    font-family: var(--font-body);
    outline: none;
    transition: border-color 0.2s;
    position: relative;
    width: 220px;
  }
  .search-wrap {
    position: relative;
    margin-left: auto;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gray2);
    pointer-events: none;
  }
  .search-box:focus { border-color: var(--green); }

  /* ─── TABLE ─── */
  .table-card {
    background: var(--dark);
    border-radius: 8px;
    border: 1px solid var(--dark3);
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead tr {
    background: var(--dark2);
    border-bottom: 1px solid var(--dark3);
  }
  thead th {
    padding: 14px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--gray2);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: color 0.2s;
  }
  thead th:hover { color: var(--green); }
  thead th.sorted { color: var(--green); }
  thead th .sort-arrow { margin-left: 4px; font-size: 10px; }
  tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background 0.15s;
    cursor: pointer;
  }
  tbody tr:hover { background: rgba(255,255,255,0.05); }
  tbody tr.selected { background: rgba(29,185,84,0.08); }
  tbody td {
    padding: 13px 16px;
    color: var(--white);
    vertical-align: middle;
  }
  td.rank {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--gray);
    width: 40px;
  }
  td.track { font-weight: 600; }
  td.artist { color: var(--gray2); }
  td.genre { color: var(--gray2); font-size: 12px; }
  .bar-cell { display: flex; align-items: center; gap: 8px; }
  .bar-bg {
    flex: 1;
    height: 4px;
    background: var(--dark3);
    border-radius: 2px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }
  .bar-val {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--gray2);
    width: 28px;
    text-align: right;
  }

  /* Energy dot */
  .energy-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
  }

  /* ─── PAGINATION ─── */
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 20px;
    border-top: 1px solid var(--dark3);
  }
  .page-btn {
    background: var(--dark2);
    border: 1px solid var(--dark3);
    color: var(--gray2);
    width: 36px; height: 36px;
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .page-btn:hover, .page-btn.active {
    background: var(--green);
    color: var(--black);
    border-color: var(--green);
  }

  /* ─── DETAIL PANEL ─── */
  .detail-panel {
    display: none;
    background: var(--dark);
    border: 1px solid var(--green);
    border-radius: 8px;
    padding: 24px;
    margin-top: 16px;
    animation: slideIn 0.3s ease;
  }
  .detail-panel.open { display: block; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .detail-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 16px 32px;
    align-items: start;
  }
  .detail-cover {
    width: 100px; height: 100px;
    background: linear-gradient(135deg, var(--green-dark), var(--dark3));
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-size: 36px;
    color: var(--white);
    flex-shrink: 0;
  }
  .detail-info h2 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .detail-info .detail-artist {
    color: var(--green);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .detail-attrs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .attr-chip {
    background: var(--dark2);
    border: 1px solid var(--dark3);
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 12px;
    font-family: var(--font-mono);
  }
  .attr-chip strong { color: var(--green); margin-right: 4px; }
  .detail-bars {
    margin-top: 16px;
  }
  .detail-bar-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }
  .detail-bar-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gray2);
    width: 90px;
    flex-shrink: 0;
  }
  .detail-bar-bg {
    flex: 1; height: 6px;
    background: var(--dark3);
    border-radius: 3px;
    overflow: hidden;
  }
  .detail-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
  }
  .detail-bar-num {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--gray2);
    width: 32px;
    text-align: right;
  }

  /* ─── TOOLTIP ─── */
  .tooltip {
    position: fixed;
    background: var(--dark2);
    border: 1px solid var(--dark3);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--white);
    pointer-events: none;
    z-index: 9999;
    display: none;
    max-width: 220px;
  }
  .tooltip strong { color: var(--green); display: block; margin-bottom: 2px; }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 1024px) {
    .container { padding: 24px 24px 48px; }
    header { padding: 32px 24px 24px; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .charts-row { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 640px) {
    .charts-row { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: 1fr 1fr; }
    .header-badge { display: none; }
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--black); }
  ::-webkit-scrollbar-thumb { background: var(--dark3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gray); }

  .no-results {
    text-align: center;
    padding: 48px;
    color: var(--gray2);
    font-size: 14px;
  }
  .no-results span { color: var(--green); font-weight: 600; }
</style>
</head>

// ─── State ───
let filtered = [...RAW];
let sortKey = 'rank';
let sortDir = 1;
let activeGenre = 'all';
let searchVal = '';
let currentPage = 1;
const PAGE_SIZE = 10;
let selectedRow = null;

// ─── Columns ───
const COLS = [
  { key:'rank',   label:'#',         type:'rank' },
  { key:'track',  label:'Canción',   type:'track' },
  { key:'artist', label:'Artista',   type:'artist' },
  { key:'genre',  label:'Género',    type:'genre' },
  { key:'bpm',    label:'BPM',       type:'num' },
  { key:'energy', label:'Energía',   type:'bar', max:100 },
  { key:'dance',  label:'Baile',     type:'bar', max:100 },
  { key:'pop',    label:'Popularidad', type:'bar', max:100 },
  { key:'val',    label:'Valencia',  type:'bar', max:100 },
  { key:'dur',    label:'Duración',  type:'dur' },
];

function fmtDur(s) {
  const m = Math.floor(s/60), sec = s%60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function energyColor(v) {
  if (v >= 75) return '#1DB954';
  if (v >= 50) return '#f59e0b';
  return '#ef4444';
}

// ─── KPI ───
function renderKPI() {
  const avgBPM = Math.round(filtered.reduce((a,d)=>a+d.bpm,0)/filtered.length);
  const avgEnergy = Math.round(filtered.reduce((a,d)=>a+d.energy,0)/filtered.length);
  const avgPop = Math.round(filtered.reduce((a,d)=>a+d.pop,0)/filtered.length);
  const genres = [...new Set(filtered.map(d=>d.genre))].length;

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">Canciones</div>
      <div class="kpi-value">${filtered.length}<span>/50</span></div>
      <div class="kpi-sub">en selección actual</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">BPM Promedio</div>
      <div class="kpi-value">${avgBPM}</div>
      <div class="kpi-sub">beats por minuto</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Energía Media</div>
      <div class="kpi-value">${avgEnergy}<span>%</span></div>
      <div class="kpi-sub">intensidad promedio</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Géneros únicos</div>
      <div class="kpi-value">${genres}</div>
      <div class="kpi-sub">estilos representados</div>
    </div>
  `;
}

// ─── Genre Filters ───
function renderGenreFilters() {
  const genres = [...new Set(RAW.map(d => d.genre))].sort();
  const wrap = document.getElementById('genreFilters');
  wrap.innerHTML = genres.map(g => `<button class="filter-btn${g===activeGenre?' active':''}" data-genre="${g}">${g}</button>`).join('');
  wrap.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeGenre = btn.dataset.genre;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector('.filter-btn[data-genre="all"]').classList.remove('active');
      applyFilters();
    });
  });
  document.querySelector('.filter-btn[data-genre="all"]').addEventListener('click', () => {
    activeGenre = 'all';
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.filter-btn[data-genre="all"]').classList.add('active');
    applyFilters();
  });
}

function applyFilters() {
  let data = [...RAW];
  if (activeGenre !== 'all') data = data.filter(d => d.genre === activeGenre);
  if (searchVal) {
    const q = searchVal.toLowerCase();
    data = data.filter(d => d.track.toLowerCase().includes(q) || d.artist.toLowerCase().includes(q));
  }
  data.sort((a,b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'string') return sortDir * av.localeCompare(bv);
    return sortDir * (av - bv);
  });
  filtered = data;
  currentPage = 1;
  renderKPI();
  renderTable();
  renderCharts();
}

// ─── TABLE ───
function renderTableHead() {
  document.getElementById('tableHead').innerHTML = COLS.map(c => `
    <th class="${c.key===sortKey?'sorted':''}" data-key="${c.key}">
      ${c.label}
      <span class="sort-arrow">${c.key===sortKey?(sortDir===1?'↑':'↓'):''}</span>
    </th>
  `).join('');
  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      if (sortKey === th.dataset.key) sortDir *= -1;
      else { sortKey = th.dataset.key; sortDir = 1; }
      applyFilters();
    });
  });
}

function renderTable() {
  renderTableHead();
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);
  const tbody = document.getElementById('tableBody');

  if (!page.length) {
    tbody.innerHTML = `<tr><td colspan="${COLS.length}"><div class="no-results">No se encontraron resultados para <span>"${searchVal}"</span></div></td></tr>`;
    renderPagination();
    return;
  }

  tbody.innerHTML = page.map(d => `
    <tr data-rank="${d.rank}" class="${selectedRow===d.rank?'selected':''}">
      <td class="rank">${d.rank}</td>
      <td class="track">${d.track}</td>
      <td class="artist">${d.artist}</td>
      <td class="genre">${d.genre}</td>
      <td style="font-family:var(--font-mono);font-size:13px">${d.bpm}</td>
      <td><div class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${d.energy}%;background:${energyColor(d.energy)}"></div></div><span class="bar-val">${d.energy}</span></div></td>
      <td><div class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${d.dance}%"></div></div><span class="bar-val">${d.dance}</span></div></td>
      <td><div class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${d.pop}%"></div></div><span class="bar-val">${d.pop}</span></div></td>
      <td><div class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:${d.val}%;background:#8b5cf6"></div></div><span class="bar-val">${d.val}</span></div></td>
      <td style="font-family:var(--font-mono);font-size:12px;color:var(--gray2)">${fmtDur(d.dur)}</td>
    </tr>
  `).join('');

  tbody.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => toggleDetail(+tr.dataset.rank));
  });
  renderPagination();
}

function toggleDetail(rank) {
  const panel = document.getElementById('detailPanel');
  if (selectedRow === rank) {
    selectedRow = null;
    panel.classList.remove('open');
    panel.innerHTML = '';
  } else {
    selectedRow = rank;
    const d = RAW.find(x => x.rank === rank);
    panel.classList.add('open');
    panel.innerHTML = `
      <div class="detail-grid">
        <div class="detail-cover">#${d.rank}</div>
        <div class="detail-info">
          <h2>${d.track}</h2>
          <div class="detail-artist">${d.artist}</div>
          <div class="detail-attrs">
            <div class="attr-chip"><strong>Género</strong>${d.genre}</div>
            <div class="attr-chip"><strong>BPM</strong>${d.bpm}</div>
            <div class="attr-chip"><strong>Duración</strong>${fmtDur(d.dur)}</div>
            <div class="attr-chip"><strong>Acústica</strong>${d.acous}%</div>
            <div class="attr-chip"><strong>Habla</strong>${d.speech}%</div>
            <div class="attr-chip"><strong>Live</strong>${d.live}%</div>
            <div class="attr-chip"><strong>Volumen</strong>${d.loud} dB</div>
          </div>
        </div>
      </div>
      <div class="detail-bars">
        ${[
          {label:'Popularidad', val:d.pop,  color:'#1DB954'},
          {label:'Energía',     val:d.energy,color:energyColor(d.energy)},
          {label:'Baile',       val:d.dance, color:'#1DB954'},
          {label:'Valencia',    val:d.val,   color:'#8b5cf6'},
          {label:'Acústica',    val:d.acous, color:'#f59e0b'},
        ].map(b=>`
          <div class="detail-bar-row">
            <div class="detail-bar-label">${b.label}</div>
            <div class="detail-bar-bg"><div class="detail-bar-fill" style="width:${b.val}%;background:${b.color}"></div></div>
            <div class="detail-bar-num">${b.val}</div>
          </div>
        `).join('')}
      </div>
    `;
  }
  renderTable();
}

// ─── PAGINATION ───
function renderPagination() {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  const pg = document.getElementById('pagination');
  if (total <= 1) { pg.innerHTML = ''; return; }
  let html = `<button class="page-btn" id="prevBtn">‹</button>`;
  for (let i = 1; i <= total; i++) {
    html += `<button class="page-btn${i===currentPage?' active':''}" data-p="${i}">${i}</button>`;
  }
  html += `<button class="page-btn" id="nextBtn">›</button>`;
  pg.innerHTML = html;
  pg.querySelectorAll('[data-p]').forEach(btn => {
    btn.addEventListener('click', () => { currentPage = +btn.dataset.p; renderTable(); });
  });
  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentPage > 1) { currentPage--; renderTable(); }
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentPage < total) { currentPage++; renderTable(); }
  });
}

// ─── CHARTS ───
let charts = {};

function renderCharts() {
  // Genre freq
  const genreCount = {};
  filtered.forEach(d => { genreCount[d.genre] = (genreCount[d.genre]||0)+1; });
  const sortedGenres = Object.entries(genreCount).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // BPM by genre
  const bpmByGenre = {};
  filtered.forEach(d => {
    if (!bpmByGenre[d.genre]) bpmByGenre[d.genre] = [];
    bpmByGenre[d.genre].push(d.bpm);
  });
  const topGenresBPM = Object.entries(bpmByGenre)
    .map(([g,bpms])=>({genre:g, avg: Math.round(bpms.reduce((a,b)=>a+b,0)/bpms.length)}))
    .sort((a,b)=>b.avg-a.avg).slice(0,7);

  const GREENS = ['#1DB954','#1ed760','#17a349','#0f7a35','#158a3e','#23d45e','#2ecc71','#27ae60'];
  const cfg = (type, data, opts) => ({ type, data, options: { responsive:true, plugins:{ legend:{display:false}, tooltip:{...TOOLTIP_STYLE}}, ...opts } });

  const TOOLTIP_STYLE = {
    backgroundColor:'#282828',
    titleColor:'#1DB954',
    bodyColor:'#b3b3b3',
    borderColor:'#333',
    borderWidth:1,
    padding:10,
    cornerRadius:6,
  };

  // Destroy old
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  // Genre chart
  charts.genre = new Chart(document.getElementById('genreChart'), {
    type: 'bar',
    data: {
      labels: sortedGenres.map(([g])=>g),
      datasets: [{ data: sortedGenres.map(([,v])=>v), backgroundColor: GREENS, borderRadius:4, borderSkipped:false }]
    },
    options: {
      responsive: true,
      indexAxis: 'y',
      plugins: { legend:{display:false}, tooltip:{ callbacks:{ label: ctx => ` ${ctx.raw} canción${ctx.raw!==1?'es':''}`}, ...TOOLTIP_STYLE } },
      scales: {
        x: { grid:{color:'rgba(255,255,255,0.05)'}, ticks:{color:'#535353',font:{size:11,family:'DM Mono'}} },
        y: { grid:{display:false}, ticks:{color:'#b3b3b3',font:{size:11}} }
      }
    }
  });

  // Scatter
  charts.scatter = new Chart(document.getElementById('scatterChart'), {
    type: 'scatter',
    data: {
      datasets: [{
        data: filtered.map(d => ({x:d.energy, y:d.pop, label:d.track, artist:d.artist})),
        backgroundColor: filtered.map(d => energyColor(d.energy) + 'cc'),
        pointRadius: 6,
        pointHoverRadius: 9,
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {display:false},
        tooltip: {
          callbacks: {
            label: ctx => {
              const pt = ctx.raw;
              return [`${pt.label}`, `${pt.artist}`, `Energía: ${pt.x} · Pop: ${pt.y}`];
            }
          },
          ...TOOLTIP_STYLE
        }
      },
      scales: {
        x: { title:{display:true,text:'Energía',color:'#535353',font:{size:11}}, grid:{color:'rgba(255,255,255,0.05)'}, ticks:{color:'#535353',font:{size:10,family:'DM Mono'}} },
        y: { title:{display:true,text:'Popularidad',color:'#535353',font:{size:11}}, grid:{color:'rgba(255,255,255,0.05)'}, ticks:{color:'#535353',font:{size:10,family:'DM Mono'}} }
      }
    }
  });

  // BPM chart
  charts.bpm = new Chart(document.getElementById('bpmChart'), {
    type: 'bar',
    data: {
      labels: topGenresBPM.map(d=>d.genre),
      datasets: [{
        data: topGenresBPM.map(d=>d.avg),
        backgroundColor: topGenresBPM.map((_,i)=>GREENS[i%GREENS.length]),
        borderRadius:4,
        borderSkipped:false,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend:{display:false}, tooltip:{ callbacks:{label:ctx=>` ${ctx.raw} BPM`}, ...TOOLTIP_STYLE } },
      scales: {
        x: { grid:{display:false}, ticks:{color:'#535353',font:{size:10},maxRotation:30} },
        y: { grid:{color:'rgba(255,255,255,0.05)'}, ticks:{color:'#535353',font:{size:10,family:'DM Mono'}}, min:80 }
      }
    }
  });
}

// ─── SEARCH ───
document.getElementById('searchBox').addEventListener('input', e => {
  searchVal = e.target.value;
  applyFilters();
});

// ─── INIT ───
renderGenreFilters();
applyFilters();
</script>
